<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <!-- must match --color-primary in src/index.css (HTML meta is outside CSS) -->
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apply a stored theme override (see src/shared/useTheme.ts) before
         first paint, so the page doesn't flash the system-default theme
         and then swap. No override stored = system preference applies via
         the prefers-color-scheme media query in src/index.css. -->
    <script>
      try {
        var theme = localStorage.getItem('fridger-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch (e) {}
    </script>

    <!-- UI/list fonts per language — see --font-* tokens in src/index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&family=Caveat:wght@400..700&family=Gveret+Levin&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Fridger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
